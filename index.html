<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quartz كوارتز - Basel / باسل</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff;
      color: #000000;
    }
    .bg-logo {
      position: fixed;
      inset: 0;
      background-image: url('logo.jpg');
      background-repeat: no-repeat;
      background-position: center;
      background-size: 90%;
      opacity: 0.3;
      z-index: 0;
    }
    .overlay {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: rgba(255,255,255,0.85);
      padding: 24px;
      border-radius: 14px;
      box-shadow: 0 6px 22px rgba(0,0,0,0.12);
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    .company {
      font-size: 1.6rem;
      font-weight: 800;
      margin-bottom: 8px;
    }
    .fullname {
      margin-top: 10px;
      font-size: 1.05rem;
      opacity: 0.9;
    }
    .fullname-en {
      display: block;
      font-size: 0.9rem;
      opacity: 0.7;
      margin-top: 4px;
    }
    .btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 12px auto;
      padding: 10px 14px;
      border-radius: 10px;
      text-decoration: none;
      color: white;
      font-weight: 700;
      max-width: 320px;
      background: #808080;
    }
    .btn span {
      display: block;
      line-height: 1.3;
    }
    .btn .en {
      font-size: 0.8rem;
      opacity: 0.9;
    }
    .small-note {
      margin-top: 10px;
      font-size: 0.85rem;
      opacity: 0.7;
    }
    @media (max-width:480px) {
      .card { padding: 18px; }
      .company { font-size: 1.3rem; }
    }
  </style>
</head>
<body>
  <div class="bg-logo" aria-hidden="true"></div>
  <div class="overlay">
    <div class="card" role="main">
      <div class="company">Quartz كوارتز</div>
      <div class="fullname">باسل محمد درويش البرازي
        <span class="fullname-en">Basel Mohammad Darwish Al-Barazi</span>
      </div>

      <a href="contact.vcf" class="btn">📇 
        <span>حفظ جهة الاتصال</span>
        <span class="en">Save Contact</span>
      </a>
      <a href="https://maps.app.goo.gl/ADJuFZvTDZEUbJtv9" class="btn">📍 
        <span>الموقع على الخريطة</span>
        <span class="en">Location</span>
      </a>
      <a href="https://wa.me/963960984715" class="btn">💬 
        <span>واتساب</span>
        <span class="en">WhatsApp</span>
      </a>
      <a href="https://www.instagram.com/quartz.b.m?igsh=eGUxem9zcXQ4MGg5" class="btn">📸 
        <span>إنستغرام</span>
        <span class="en">Instagram</span>
      </a>
      <a href="https://www.facebook.com/share/1JXfjmsSpZ/" class="btn">📘 
        <span>فيسبوك</span>
        <span class="en">Facebook</span>
      </a>

      <div class="small-note">امسح الكود أو اضغط الأزرار</div>
    </div>
  </div>
</body>
</html>
