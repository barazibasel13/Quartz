<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ceramix سيرامكس</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    :root {
      --gold: #C9A96E;
      --gold-light: #E5D5A8;
      --charcoal: #1A1A2E;
      --charcoal-light: #2D2D44;
      --white: #FFFFFF;
      --cream: #F5F0E8;
      --gray-text: #6B6B7B;
    }
    html, body {
      margin: 0;
      padding: 0;
      font-family: 'Cairo', 'Poppins', sans-serif;
      background: var(--charcoal);
      color: var(--white);
      height: 100%;
      overflow: hidden;
    }
    .bg-pattern {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 80%, rgba(201,169,110,0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 20%, rgba(201,169,110,0.06) 0%, transparent 50%);
      z-index: 0;
      pointer-events: none;
    }
    .container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      padding: 16px;
    }
    .logo-wrap {
      width: 100%;
      max-width: 360px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      animation: fadeInDown 0.8s ease-out;
    }
    .logo-wrap img {
      max-width: 100%;
      max-height: 22vh;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 4px 20px rgba(0,0,0,0.3));
    }
    .card {
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(201,169,110,0.15);
      padding: 24px 22px;
      border-radius: 20px;
      box-shadow:
        0 8px 32px rgba(0,0,0,0.3),
        inset 0 1px 0 rgba(255,255,255,0.05);
      max-width: 400px;
      width: 100%;
      text-align: center;
      animation: fadeInUp 0.8s ease-out 0.2s both;
    }
    .company {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 4px;
      color: var(--gold-light);
      letter-spacing: 1px;
    }
    .divider {
      width: 50px;
      height: 2px;
      background: var(--gold);
      margin: 10px auto 16px;
      border-radius: 2px;
    }
    .btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 10px auto;
      padding: 12px 16px;
      border-radius: 14px;
      text-decoration: none;
      color: var(--white);
      font-weight: 700;
      max-width: 300px;
      background: var(--charcoal-light);
      border: 1px solid rgba(201,169,110,0.2);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }
    .btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--gold);
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 0;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(201,169,110,0.2);
      border-color: var(--gold);
    }
    .btn:hover::before {
      opacity: 0.08;
    }
    .btn span {
      display: block;
      line-height: 1.4;
      position: relative;
      z-index: 1;
    }
    .btn .en {
      font-size: 0.78rem;
      opacity: 0.65;
      font-weight: 500;
      font-family: 'Poppins', sans-serif;
    }
    .btn .icon {
      font-size: 1.3rem;
      margin-bottom: 4px;
    }
    .small-note {
      margin-top: 14px;
      font-size: 0.82rem;
      opacity: 0.5;
      color: var(--gold-light);
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (max-width:480px) {
      .card { padding: 18px 16px; border-radius: 16px; }
      .company { font-size: 1.25rem; }
      .btn { margin: 8px auto; padding: 10px 14px; border-radius: 12px; }
      .logo-wrap { margin-bottom: 14px; }
      .logo-wrap img { max-height: 18vh; }
    }
  </style>
<base target="_blank">
</head>
<body>
  <div class="bg-pattern" aria-hidden="true"></div>
  <div class="container">
    <div class="logo-wrap">
      <img src="./ceramix_logo.jpg" alt="Ceramix Logo">
    </div>
    <div class="card" role="main">
      <div class="company">Ceramix سيرامكس</div>
      <div class="divider"></div>

      <a href="https://maps.app.goo.gl/QABHYKsAw2B9e8xB7" class="btn">
        <span class="icon">📍</span>
        <span>الفرع الرئيسي - حماة</span>
        <span class="en">Main Branch - Hama</span>
      </a>
      <a href="https://maps.app.goo.gl/bA7Ssby7xkU47LfC8?g_st=ac" class="btn">
        <span class="icon">📍</span>
        <span>فرع مدينة حمص</span>
        <span class="en">Homs City Branch</span>
      </a>
      <a href="https://wa.me/963960984715" class="btn">
        <span class="icon">💬</span>
        <span>واتساب</span>
        <span class="en">WhatsApp</span>
      </a>
      <a href="https://www.instagram.com/ceramix_showroom" class="btn">
        <span class="icon">📸</span>
        <span>إنستغرام</span>
        <span class="en">Instagram</span>
      </a>
      <a href="https://www.facebook.com/share/1JUc7A6BRs/" class="btn">
        <span class="icon">📘</span>
        <span>فيسبوك</span>
        <span class="en">Facebook</span>
      </a>

      <div class="small-note">سيرامكس ، لأن التفاصيل تهم</div>
    </div>
  </div>
</body>
</html>
