<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ceramix سيرامكس</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --gold: #C9A96E;
      --gold-light: #E5D5A8;
      --charcoal: #1A1A2E;
      --charcoal-light: #2D2D44;
      --white: #FFFFFF;
    }
    html, body {
      font-family: 'Cairo', 'Poppins', sans-serif;
      background: var(--charcoal);
      color: var(--white);
      min-height: 100%;
      overflow-x: hidden;
    }
    .bg-pattern {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 80%, rgba(201,169,110,0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 20%, rgba(201,169,110,0.06) 0%, transparent 50%);
      z-index: 0;
      pointer-events: none;
    }
    .container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      width: 100%;
      padding: 16px;
    }
    .logo-wrap {
      width: 100%;
      max-width: 320px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
      animation: fadeInDown 0.8s ease-out;
      flex-shrink: 0;
    }
    .logo-wrap img {
      width: auto;
      height: auto;
      max-width: 85%;
      max-height: 130px;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 4px 20px rgba(0,0,0,0.3));
    }
    .card {
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(201,169,110,0.15);
      padding: 18px 20px;
      border-radius: 18px;
      box-shadow:
        0 8px 32px rgba(0,0,0,0.3),
        inset 0 1px 0 rgba(255,255,255,0.05);
      max-width: 380px;
      width: 100%;
      text-align: center;
      animation: fadeInUp 0.8s ease-out 0.2s both;
      flex-shrink: 0;
    }
    .company {
      font-size: clamp(1.15rem, 4.5vw, 1.5rem);
      font-weight: 800;
      margin-bottom: 2px;
      color: var(--gold-light);
      letter-spacing: 1px;
    }
    .divider {
      width: 40px;
      height: 2px;
      background: var(--gold);
      margin: 8px auto 12px;
      border-radius: 2px;
    }
    .btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 8px auto;
      padding: 10px 14px;
      border-radius: 12px;
      text-decoration: none;
      color: var(--white);
      font-weight: 700;
      max-width: 280px;
      width: 100%;
      background: var(--charcoal-light);
      border: 1px solid rgba(201,169,110,0.2);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }
    .btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--gold);
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 0;
    }
    .btn:hover, .btn:active {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(201,169,110,0.2);
      border-color: var(--gold);
    }
    .btn:hover::before, .btn:active::before {
      opacity: 0.08;
    }
    .btn span {
      display: block;
      line-height: 1.35;
      position: relative;
      z-index: 1;
    }
    .btn .en {
      font-size: clamp(0.7rem, 2.5vw, 0.78rem);
      opacity: 0.65;
      font-weight: 500;
      font-family: 'Poppins', sans-serif;
    }
    .btn .icon {
      font-size: clamp(1.1rem, 3.5vw, 1.3rem);
      margin-bottom: 2px;
    }
    .small-note {
      margin-top: 10px;
      font-size: clamp(0.72rem, 2.5vw, 0.82rem);
      opacity: 0.5;
      color: var(--gold-light);
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== Small phones (<= 360px) ===== */
    @media (max-width: 360px) {
      .container { padding: 10px; }
      .logo-wrap { max-width: 240px; margin-bottom: 8px; }
      .logo-wrap img { max-height: 100px; }
      .card { padding: 12px 14px; border-radius: 14px; }
      .btn { padding: 8px 10px; margin: 5px auto; border-radius: 10px; }
      .company { letter-spacing: 0.5px; }
      .small-note { margin-top: 6px; }
    }

    /* ===== Medium phones (361px - 480px) ===== */
    @media (min-width: 361px) and (max-width: 480px) {
      .container { padding: 12px; }
      .logo-wrap { max-width: 280px; margin-bottom: 10px; }
      .logo-wrap img { max-height: 115px; }
      .card { padding: 14px 16px; }
      .btn { padding: 9px 12px; margin: 6px auto; }
    }

    /* ===== Large phones / small tablets (481px - 768px) ===== */
    @media (min-width: 481px) and (max-width: 768px) {
      .logo-wrap { max-width: 340px; margin-bottom: 16px; }
      .logo-wrap img { max-height: 150px; }
      .card { padding: 22px 26px; max-width: 420px; }
      .btn { padding: 12px 16px; margin: 10px auto; max-width: 320px; }
    }

    /* ===== Tablets & up (769px+) ===== */
    @media (min-width: 769px) {
      .logo-wrap { max-width: 380px; margin-bottom: 20px; }
      .logo-wrap img { max-height: 170px; }
      .card { padding: 28px 32px; max-width: 460px; }
      .btn { padding: 14px 18px; margin: 12px auto; max-width: 340px; }
      .company { margin-bottom: 4px; }
      .divider { margin: 10px auto 16px; width: 50px; }
      .small-note { margin-top: 14px; }
    }

    /* ===== Landscape on small screens - SCROLLABLE ===== */
    @media (max-height: 520px) and (orientation: landscape) {
      .container {
        justify-content: flex-start;
        padding-top: 12px;
        padding-bottom: 20px;
        overflow-y: auto;
      }
      .logo-wrap { max-width: 180px; margin-bottom: 8px; }
      .logo-wrap img { max-height: 90px; }
      .card { padding: 10px 14px; }
      .btn { padding: 6px 10px; margin: 5px auto; }
      .company { font-size: 1.05rem; }
      .small-note { margin-top: 6px; font-size: 0.7rem; }
    }

    /* ===== Very short landscape (<= 400px height) - SCROLLABLE ===== */
    @media (max-height: 400px) and (orientation: landscape) {
      .container {
        justify-content: flex-start;
        padding-top: 8px;
        padding-bottom: 16px;
        overflow-y: auto;
      }
      .logo-wrap { max-width: 150px; margin-bottom: 6px; }
      .logo-wrap img { max-height: 70px; }
      .card { padding: 8px 12px; border-radius: 12px; }
      .btn { padding: 5px 8px; margin: 4px auto; border-radius: 8px; }
      .btn .icon { font-size: 1rem; }
      .company { font-size: 0.95rem; }
      .divider { margin: 4px auto 6px; }
      .small-note { margin-top: 4px; font-size: 0.65rem; }
    }

    /* ===== Content too tall for viewport - SCROLLABLE ===== */
    @media (max-height: 700px) and (orientation: portrait) {
      .container {
        justify-content: flex-start;
        padding-top: 16px;
        padding-bottom: 24px;
        overflow-y: auto;
      }
    }
  </style>
<base target="_blank">
</head>
<body>
  <div class="bg-pattern" aria-hidden="true"></div>
  <div class="container">
    <div class="logo-wrap">
      <img src="./ceramix_logo.jpg" alt="Ceramix Logo">
    </div>
    <div class="card" role="main">
      <div class="company">Ceramix سيرامكس</div>
      <div class="divider"></div>

      <a href="https://maps.app.goo.gl/QABHYKsAw2B9e8xB7" class="btn">
        <span class="icon">📍</span>
        <span>الفرع الرئيسي - حماة</span>
        <span class="en">Main Branch - Hama</span>
      </a>
      <a href="https://maps.app.goo.gl/bA7Ssby7xkU47LfC8?g_st=ac" class="btn">
        <span class="icon">📍</span>
        <span>فرع مدينة حمص</span>
        <span class="en">Homs City Branch</span>
      </a>
      <a href="https://wa.me/963960984715" class="btn">
        <span class="icon">💬</span>
        <span>واتساب</span>
        <span class="en">WhatsApp</span>
      </a>
      <a href="https://www.instagram.com/ceramix_showroom" class="btn">
        <span class="icon">📸</span>
        <span>إنستغرام</span>
        <span class="en">Instagram</span>
      </a>
      <a href="https://www.facebook.com/share/1JUc7A6BRs/" class="btn">
        <span class="icon">📘</span>
        <span>فيسبوك</span>
        <span class="en">Facebook</span>
      </a>

      <div class="small-note">سيرامكس ، لأن التفاصيل تهم</div>
    </div>
  </div>
</body>
</html>
