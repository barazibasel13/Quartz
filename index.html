<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ceramix سيرامكس</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #fff;
      color: #000000;
      height: 100%;
      overflow: hidden;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      padding: 16px;
    }
    .logo-wrap {
      width: 100%;
      max-width: 380px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }
    .logo-wrap img {
      max-width: 100%;
      max-height: 28vh;
      object-fit: contain;
      display: block;
    }
    .card {
      background: rgba(255,255,255,0.85);
      padding: 18px 20px;
      border-radius: 14px;
      box-shadow: 0 6px 22px rgba(0,0,0,0.12);
      max-width: 420px;
      width: 100%;
      text-align: center;
      overflow-y: auto;
    }
    .company {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 10px;
    }
    .btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 10px auto;
      padding: 10px 14px;
      border-radius: 10px;
      text-decoration: none;
      color: white;
      font-weight: 700;
      max-width: 320px;
      background: #808080;
    }
    .btn span {
      display: block;
      line-height: 1.3;
    }
    .btn .en {
      font-size: 0.8rem;
      opacity: 0.9;
    }
    .small-note {
      margin-top: 10px;
      font-size: 0.85rem;
      opacity: 0.7;
    }
    @media (max-width:480px) {
      .card { padding: 14px 16px; }
      .company { font-size: 1.2rem; }
      .btn { margin: 8px auto; padding: 8px 12px; }
    }
  </style>
<base target="_blank">
</head>
<body>
  <div class="container">
    <div class="logo-wrap">
      <img src="./ceramix_logo.jpg" alt="Ceramix Logo">
    </div>
    <div class="card" role="main">
      <div class="company">Ceramix سيرامكس</div>

      <a href="https://maps.app.goo.gl/QABHYKsAw2B9e8xB7" class="btn">📍 
        <span>الفرع الرئيسي - حماة</span>
        <span class="en">Main Branch - Hama</span>
      </a>
      <a href="https://maps.app.goo.gl/bA7Ssby7xkU47LfC8?g_st=ac" class="btn">📍 
        <span>فرع مدينة حمص</span>
        <span class="en">Homs City Branch</span>
      </a>
      <a href="https://wa.me/963960984715" class="btn">💬 
        <span>واتساب</span>
        <span class="en">WhatsApp</span>
      </a>
      <a href="https://www.instagram.com/ceramix_showroom" class="btn">📸 
        <span>إنستغرام</span>
        <span class="en">Instagram</span>
      </a>
      <a href="https://www.facebook.com/share/1JUc7A6BRs/" class="btn">📘 
        <span>فيسبوك</span>
        <span class="en">Facebook</span>
      </a>

      <div class="small-note">سيرامكس ، لأن التفاصيل تهم</div>
    </div>
  </div>
</body>
</html>
